# Render Blueprint: in the Render dashboard choose "New > Blueprint" and pick this repository.
# You'll be asked for DATABASE_URL: paste the connection string from Neon (or leave it empty
# to run with the in-memory database, where the leaderboard resets whenever the app restarts).
services:
  - type: web
    name: mathwars
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
