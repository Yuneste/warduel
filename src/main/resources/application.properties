# Server Configuration
server.port=${PORT:8080}
server.tomcat.connection-timeout=300000
server.servlet.session.timeout=30m
# Behind Render's proxy: trust X-Forwarded-* so the app knows it is served over https
server.forward-headers-strategy=framework

# Origins allowed to open the /game WebSocket (comma-separated, override with APP_ALLOWED_ORIGINS).
# On Render, RENDER_EXTERNAL_URL is the service's public https address and is set automatically.
app.allowed-origins=${RENDER_EXTERNAL_URL:http://localhost:8080},http://localhost:8080

# Logging
logging.level.com.warduel.warduel=INFO
# Postgres reports harmless notices while Hibernate updates the schema; real SQL errors are still logged
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR

# Database: in-memory H2 by default (leaderboard resets on restart).
# Set DATABASE_URL=postgresql://user:password@host/db?sslmode=require (e.g. from Neon) to use Postgres;
# see DatabaseUrlEnvironmentPostProcessor.
spring.datasource.url=jdbc:h2:mem:warduel
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Small pool: the free tiers allow few connections, and the leaderboard writes rarely
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Game Configuration (can be overridden)
game.duration-seconds=60
game.questions-per-game=20
game.win-score=20
game.min-number=1
game.max-number=20
game.multiplication-min=1
game.multiplication-max=10
game.division-min=1
game.division-max=10
# Challenge type for public games: CLASSIC, TRUE_FALSE, MISSING_NUMBER or COMPARE (empty = random per game)
game.public-challenge-type=
# Seconds the creator of an invite link has to accept a challenge
game.challenge-timeout-seconds=10
